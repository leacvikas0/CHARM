[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charm-motion"
version = "0.1.0"
description = "CHARM: Character-aware Holds and Adaptive Rhythm for Motion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "leacvikas0"}]
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
preview = ["Pillow>=10"]
showcase = ["Pillow>=10", "opencv-python>=4.8"]

[project.urls]
Repository = "https://github.com/leacvikas0/CHARM"
Issues = "https://github.com/leacvikas0/CHARM/issues"

[project.scripts]
charm = "motionkit.cli:main"
motionkit = "motionkit.cli:main"

[tool.setuptools.packages.find]
include = ["motionkit*"]
